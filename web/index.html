<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4d3b" />
    <meta name="description" content="แจ้งของหาย แจ้งเจอของ และตามหาของคืนภายในมหาวิทยาลัยกรุงเทพ" />
    <title>BU Lost &amp; Found</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Itim&display=swap"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("bu-lf-theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch (storageError) {
        console.warn("Theme preference unavailable", storageError);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
